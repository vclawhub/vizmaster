name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # The OMP SDK's native helpers are irrelevant to typecheck/build, and
        # skipping install scripts keeps CI deterministic.
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - uses: oven-sh/setup-bun@v2
      - name: OMP tool smoke test
        run: bun run scripts/tools-smoke.ts
